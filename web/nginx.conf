server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app calls /api on its own origin (src/apiBase.ts), so it also works from another device on the LAN
    # (http://<computer-ip>:5173). Docker's resolver plus a variable: nginx starts even while the api service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    # Kestrel's default request body limit (≈30 MB); uploads are sent as base64 JSON.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
