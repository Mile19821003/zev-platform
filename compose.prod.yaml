# Production stack for a single Linux Docker host. See OPERATIONAL_BACKUP_RESTORE.md.
# Start:  docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
name: zev

services:
  # The backup volume is new and empty, so its mount point would be root-owned; SQL Server runs as uid 10001.
  init-permissions:
    image: busybox:1.37
    network_mode: none
    command: ["sh", "-c", "mkdir -p /backups/db /backups/files /backups/drill && chown -R 10001:0 /backups && chmod -R 770 /backups"]
    volumes:
      - zev_db_backups:/backups
    restart: "no"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env.prod}
      MSSQL_PID: ${MSSQL_PID:?Set MSSQL_PID (licensed edition or product key) in .env.prod}
    volumes:
      - zev_db_data:/var/opt/mssql
      - zev_db_backups:/var/opt/mssql/backups
    healthcheck:
      # Healthy only when every database (except the temporary drill database) is ONLINE: right after a start
      # master answers while Zev is still recovering, and dependants would fail to open it.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -o /dev/null -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE' AND name <> 'Zev_Drill') RAISERROR('databases not online', 16, 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    # The image's launch_sqlservr.sh backgrounds sqlservr and waits, so bash as PID 1 never forwards SIGTERM and
    # every stop ends in SIGKILL (exit 137) and crash recovery. Its custom-setup hooks (MSSQL_DB,
    # /mssql-server-setup-scripts.d) are unused here, so run sqlservr directly and give it time to checkpoint.
    entrypoint: ["/opt/mssql/bin/sqlservr"]
    command: []
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [internal]

  # One-shot: creates the database if missing, applies the reviewed idempotent migration script
  # and (re)binds the least-privileged application login. The API only starts after it succeeds.
  migrate:
    build:
      context: ./deploy/migrator
      additional_contexts:
        api: ./src/Zev.Api
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env.prod}
      APP_DB_LOGIN: ${APP_DB_LOGIN:-zev_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.prod}
      DB_HOST: db
      DB_NAME: Zev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build: ./src/Zev.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=Zev;User Id=${APP_DB_LOGIN:-zev_app};Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env.prod}
      Web__Origin: https://${ZEV_DOMAIN:?Set ZEV_DOMAIN in .env.prod}
      ReverseProxy__KnownProxies__0: ${ZEV_PROXY_IP:-172.28.0.10}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - zev_files:/app/storage
    healthcheck:
      # The aspnet image has no curl/wget; use bash's /dev/tcp against the readiness endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        # Same origin as the API (routed by the proxy), so no CORS and the refresh cookie stays first-party.
        VITE_API_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: caddy:2.8.4-alpine
    environment:
      ZEV_DOMAIN: ${ZEV_DOMAIN:?Set ZEV_DOMAIN in .env.prod}
      # ACME e-mail for public certificates, or "internal" for a self-signed CA (testing only).
      ZEV_TLS: ${ZEV_TLS:?Set ZEV_TLS (ACME e-mail or internal) in .env.prod}
    ports:
      - "${ZEV_HTTP_PORT:-80}:80"
      - "${ZEV_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - zev_caddy_data:/data
      - zev_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      internal:
        # Fixed address: the API trusts X-Forwarded-* only from this proxy (ReverseProxy:KnownProxies).
        ipv4_address: ${ZEV_PROXY_IP:-172.28.0.10}

networks:
  internal:
    ipam:
      config:
        - subnet: ${ZEV_SUBNET:-172.28.0.0/24}

volumes:
  zev_db_data:
    name: ${ZEV_VOLUME_PREFIX:-zev}_db_data
  zev_db_backups:
    name: ${ZEV_VOLUME_PREFIX:-zev}_db_backups
  zev_files:
    name: ${ZEV_VOLUME_PREFIX:-zev}_files
  zev_caddy_data:
    name: ${ZEV_VOLUME_PREFIX:-zev}_caddy_data
  zev_caddy_config:
    name: ${ZEV_VOLUME_PREFIX:-zev}_caddy_config
